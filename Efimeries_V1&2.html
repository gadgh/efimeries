		/**
		 * Αλγόριθμος backtracking με ευρετική MRV για αυτόματη τοποθέτηση καρτών.
		 * Σέβεται όλους τους περιορισμούς (βάρδια, διαθεσιμότητα, αποκλεισμούς, ίδια θέση,
		 * στόχους εφημεριών ανά καθηγητή, χαλάρωση) και χρησιμοποιεί τις προτεραιότητες
		 * `priorityAvailability` και `priorityTeachers` για τη σειρά δοκιμής των καθηγητών.
		 *
		 * @param {Array} allCards - Λίστα με όλες τις κάρτες που πρέπει να τοποθετηθούν.
		 * @param {Object} teacherTargetsForAttempt - Στόχοι εφημεριών για κάθε καθηγητή στην τρέχουσα προσπάθεια.
		 * @param {number} baseDuties - Βασικός αριθμός εφημεριών (π.χ. 2) για τους μη‑extra καθηγητές.
		 * @param {Object} algorithmSettings - Ρυθμίσεις αλγορίθμου (relaxation, allowSamePosition, priorityAvailability, priorityTeachers, distribution).
		 * @param {Object} teacherTotalAvailability - Αριθμός συνολικών διαθέσιμων ημερών/βαρδιών για κάθε καθηγητή.
		 * @param {Array} days - Λίστα με τα ονόματα των ημερών.
		 * @param {Object} teacherShifts - Διαθεσιμότητα καθηγητών ανά ημέρα (τιμή 1 ή 2 για βάρδια).
		 * @param {Object} teacherPositionExclusions - Αποκλεισμοί καθηγητών από θέσεις (Set).
		 * @param {Array} teachers - Λίστα με όλους τους καθηγητές.
		 * @returns {Object|null} Επιστρέφει αντικείμενο placements αν βρεθεί λύση, αλλιώς null.
		 */
		function backtrackingAssignment(allCards, teacherTargetsForAttempt, baseDuties, algorithmSettings, teacherTotalAvailability, days, teacherShifts, teacherPositionExclusions, teachers, timeoutMs = 5000) {
			// Αντιγραφή της λίστας καρτών – δεν θέλουμε να τροποποιήσουμε την αρχική
			let remaining = [...allCards];
			let currentPlacements = {};      // Τοποθετήσεις στην τρέχουσα αναδρομική διαδρομή
			let teacherDutyCount = {};       // Πόσες εφημερίες έχει ήδη κάθε καθηγητής
			const startTime = Date.now();
			teachers.forEach(t => teacherDutyCount[t] = 0);

			/**
			 * Υπολογίζει τους καθηγητές που είναι επιλέξιμοι για μια δεδομένη κάρτα,
			 * λαμβάνοντας υπόψη όλους τους περιορισμούς (βάρδια, αποκλεισμοί, όρια,
			 * διαθεσιμότητα κελιού, ίδια θέση κ.λπ.).
			 */
			function getEligibleTeachers(card, currentPlacements, teacherDutyCount) {
				// 1. Βασική διαθεσιμότητα από teacherShifts (σωστή βάρδια, όχι αποκλεισμένη θέση)
				let available = teachers.filter(t =>
					teacherShifts[t]?.[days[card.day]] === card.shift &&
					!(teacherPositionExclusions[t]?.has(card.position))
				);

				// 2. Εφαρμογή ορίων ανάλογα με το επίπεδο χαλάρωσης και τον τύπο κατανομής
				let eligible = [];
				if (algorithmSettings.distribution === 'manual') {
					// Χειροκίνητη κατανομή: αυστηρά μικρότερο από τον στόχο
					eligible = available.filter(t => teacherDutyCount[t] < teacherTargetsForAttempt[t]);
				} else {
					// Αυτόματη κατανομή
					if (algorithmSettings.relaxation === 'none') {
						eligible = available.filter(t => teacherDutyCount[t] < teacherTargetsForAttempt[t]);
					} else {
						// Μερική χαλάρωση: βασικοί επιτρέπεται +1, extra μόνο έως τον στόχο
						eligible = available.filter(t => {
							const target = teacherTargetsForAttempt[t];
							const current = teacherDutyCount[t];
							if (target === baseDuties) {
								return current <= target + 1;      // βασικοί: μπορούν να φτάσουν +1
							} else {
								return current < target;           // extra: αυστηρά
							}
						});
					}
				}

				// 3. Αν δεν επιτρέπεται η ίδια θέση στον ίδιο καθηγητή, αφαίρεσε όσους την έχουν ήδη
				if (!algorithmSettings.allowSamePosition) {
					eligible = eligible.filter(t =>
						!teacherHasPositionInPlacements(t, card.position, currentPlacements)
					);
				}

				// 4. Αποκλεισμός αν το συγκεκριμένο κελί (καθηγητής, μέρα, βάρδια) είναι ήδη κατειλημμένο
				eligible = eligible.filter(t => {
					const cellOccupied = Object.values(currentPlacements).some(p =>
						p.teacher === t && p.day === days[card.day] && p.shift === card.shift
					);
					return !cellOccupied;
				});

				return eligible;
			}

			/**
			 * Αναδρομική συνάρτηση backtracking.
			 * @returns {boolean} true αν βρέθηκε λύση, false αν αδιέξοδο.
			 */
			function backtrack(remainingCards, currentPlacements, teacherDutyCount) {

				if (Date.now() - startTime > timeoutMs) {
					return false;   // υπέρβαση χρόνου – τερματισμός
				}
				
				if (remainingCards.length === 0) return true;   // όλες τοποθετήθηκαν

				// --- Ευρετική MRV: επιλογή κάρτας με τις λιγότερες επιλογές ---
				let bestCard = null;
				let bestOptions = null;
				let bestOptionsCount = Infinity;

				for (let card of remainingCards) {
					const options = getEligibleTeachers(card, currentPlacements, teacherDutyCount);
					if (options.length === 0) return false;     // αδιέξοδο
					if (options.length < bestOptionsCount) {
						bestOptionsCount = options.length;
						bestCard = card;
						bestOptions = options;
						if (bestOptionsCount === 1) break;      // βέλτιστο, σταματάμε την αναζήτηση
					}
				}
				if (!bestCard) return false;

				// Αφαίρεση της επιλεγμένης κάρτας από τα υπόλοιπα
				const newRemaining = remainingCards.filter(c => c !== bestCard);

				// --- Ταξινόμηση υποψηφίων καθηγητών σύμφωνα με τις προτεραιότητες ---
				let sortedOptions = [...bestOptions];
				sortedOptions.sort((a, b) => {
					if (algorithmSettings.priorityAvailability && algorithmSettings.priorityTeachers) {
						// Σύνθετη προτεραιότητα: πρώτα βάσει συνολικής διαθεσιμότητας, μετά βάσει φόρτου
						if (teacherTotalAvailability[a] !== teacherTotalAvailability[b]) {
							return teacherTotalAvailability[a] - teacherTotalAvailability[b];
						} else {
							return teacherDutyCount[a] - teacherDutyCount[b];
						}
					} else if (algorithmSettings.priorityAvailability) {
						// Μόνο βάσει συνολικής διαθεσιμότητας (λιγότερες διαθέσιμες μέρες/βάρδιες πρώτοι)
						return teacherTotalAvailability[a] - teacherTotalAvailability[b];
					} else if (algorithmSettings.priorityTeachers) {
						// Μόνο βάσει φόρτου (λιγότερες εφημερίες μέχρι τώρα πρώτοι)
						return teacherDutyCount[a] - teacherDutyCount[b];
					} else {
						// Τυχαία σειρά (για διαφορετικά αποτελέσματα)
						return Math.random() - 0.5;
					}
				});

				// Δοκιμή κάθε υποψηφίου καθηγητή (με τη σειρά που ορίζουν οι προτεραιότητες)
				for (let teacher of sortedOptions) {
					// Τοποθέτηση
					currentPlacements[bestCard.id] = {
						teacher: teacher,
						day: days[bestCard.day],
						shift: bestCard.shift,
						position: bestCard.position
					};
					teacherDutyCount[teacher]++;

					// Αναδρομή
					if (backtrack(newRemaining, currentPlacements, teacherDutyCount)) {
						return true;
					}

					// Επαναφορά (backtrack)
					delete currentPlacements[bestCard.id];
					teacherDutyCount[teacher]--;
				}

				return false;   // καμία επιλογή δεν οδήγησε σε λύση
			}

			// Εκκίνηση της αναδρομής
			const success = backtrack(remaining, currentPlacements, teacherDutyCount);
			return success ? currentPlacements : null;
		}

		// Αυτόματη δημιουργία προγράμματος εφημεριών
		function autoAssignDuties() {
			console.log('=== autoAssignDuties START ===');
			console.log('teachers.length:', teachers.length);
			console.log('days.length:', days.length);
			console.log('positionNames.length:', positionNames.length);
			console.log('dutyCards.length:', dutyCards.length);
			console.log('algorithmSettings.distribution:', algorithmSettings.distribution);
			console.log('dutyCards length:', dutyCards.length);
			if (algorithmSettings.distribution === 'manual') {
				console.log('manualTargets:', manualTargets);
				const totalManual = Object.values(manualTargets).reduce((a,b)=>a+b,0);
				console.log('totalManual:', totalManual);
			}
			// ΕΛΕΓΧΟΣ 1: Υπάρχουν όλα τα απαραίτητα δεδομένα;
			if (!teachers.length || !days.length || !positionNames.length) {
				showModalMessage('Φορτώστε αρχείο και ορίστε θέσεις πρώτα', 'error', 2000);
				return;
			}
			
			// Υπολογισμός αναμενόμενων εφημεριών
			const expectedDuties = positionNames.length * days.length * 2;
			console.log('expectedDuties:', expectedDuties);
			
			// Καθορισμός στόχων ανάλογα με τη μέθοδο κατανομής
			let teacherTargets = {};
			let baseDuties, extraTeachers;
			
			if (algorithmSettings.distribution === 'manual') {
				// Χρήση χειροκίνητης κατανομής
				const totalManual = Object.values(manualTargets).reduce((a, b) => a + b, 0);
				
				if (totalManual !== expectedDuties) {
					showModalMessage(`Λάθος κατανομή! Σύνολο ${totalManual}/${expectedDuties} εφημερίες`, 'error', 2000);
					return;
				}
				
				// Χρήση manualTargets ως teacherTargets
				teacherTargets = {...manualTargets};
				baseDuties = Math.min(...Object.values(manualTargets));
				extraTeachers = Object.values(manualTargets).filter(v => v > baseDuties).length;
				
			} else {
				// Αυτόματη κατανομή
				const distribution = calculateDutyDistribution();
				console.log('distribution:', distribution);
				if (!distribution) {
					showModalMessage('Αδύνατος υπολογισμός κατανομής', 'error', 2000);
					return;
				}
				
				baseDuties = distribution.baseDuties;
				extraTeachers = distribution.extraTeachers;
				
				// Τυχαία επιλογή extra καθηγητών
				const extraTeacherIndices = new Set();
				while (extraTeacherIndices.size < extraTeachers) {
					extraTeacherIndices.add(Math.floor(Math.random() * teachers.length));
				}
				
				teacherTargets = {};
				teachers.forEach((teacher, index) => {
					teacherTargets[teacher] = extraTeacherIndices.has(index) ? baseDuties + 1 : baseDuties;
				});
			}
			
			// ΒΗΜΑ 1: Δημιουργία λίστας με ΟΛΕΣ τις κάρτες που πρέπει να τοποθετηθούν
			const allCards = [];
			positionNames.forEach(position => {
				days.forEach((day, dayIndex) => {
					for (let shift = 1; shift <= 2; shift++) {
						// Βρες την αντίστοιχη κάρτα από την υπάρχουσα λίστα dutyCards
						const card = dutyCards.find(c => 
							c.position === position && 
							c.shift === shift && 
							c.day === dayIndex
						);
						if (card) {
							allCards.push(card);
						} else {
							console.warn(`Δεν βρέθηκε κάρτα για ${position}, ημέρα ${dayIndex}, βάρδια ${shift}`);
						}
					}
				});
			});
			
			console.log(`Συνολικές κάρτες προς τοποθέτηση: ${allCards.length}`);
			
			// ΒΗΜΑ 2: Προετοιμασία για πολλαπλές προσπάθειες
			let bestPlacements = {};      // Καλύτερη λύση μέχρι στιγμής
			let bestPlaced = 0;           // Αριθμός καρτών στην καλύτερη λύση
			let lastPlacements = {}; // Για την τελευταία προσπάθεια			
			const maxAttempts = algorithmSettings.maxAttempts;       // Μέγιστος αριθμός προσπαθειών
			let attempts = 0;
			
			// Υπολογισμός συνολικής διαθεσιμότητας μία φορά
			if (algorithmSettings.priorityAvailability) {
				updateTeacherTotalAvailability();
			}
			console.log('teacherShifts sample:', Object.keys(teacherShifts).slice(0,3), teacherShifts[teachers[1]]);
			// Επανάληψη μέχρι να τοποθετηθούν όλες ή να εξαντληθούν οι προσπάθειες
			while (bestPlaced < allCards.length && attempts < maxAttempts) {
				console.log('Entering while loop')
				attempts++;
				let teacherTargetsForAttempt;

				if (algorithmSettings.distribution === 'manual') {
					// ΧΕΙΡΟΚΙΝΗΤΗ: χρησιμοποίησε τα ίδια targets για όλες τις προσπάθειες
					teacherTargetsForAttempt = {...manualTargets};
				} else {
					// ΑΥΤΟΜΑΤΗ: τυχαία επιλογή extra καθηγητών σε κάθε προσπάθεια				
					// ΒΗΜΑ 3: Τυχαία επιλογή ποιοι καθηγητές θα κάνουν extra εφημερία
					const extraTeacherIndices = new Set();
					while (extraTeacherIndices.size < extraTeachers) {
						extraTeacherIndices.add(Math.floor(Math.random() * teachers.length));
					}
					
					// ΒΗΜΑ 4: Ορισμός στόχων για κάθε καθηγητή
					teacherTargetsForAttempt = {};
					teachers.forEach((teacher, index) => {
						teacherTargetsForAttempt[teacher] = extraTeacherIndices.has(index) ? baseDuties + 1 : baseDuties;
					});
				}
				
				// ΒΗΜΑ 5: Υπολογισμός για κάθε κάρτα ποιοι καθηγητές είναι διαθέσιμοι
				const cardOptions = allCards.map(card => {
					// Βρες όλους τους καθηγητές που:
					// 1. Έχουν διαθεσιμότητα τη συγκεκριμένη μέρα/βάρδια
					const availableTeachers = teachers.filter(t => 
						teacherShifts[t]?.[days[card.day]] === card.shift &&
						!(teacherPositionExclusions[t]?.has(card.position))
					);
					
					return {
						card: card,
						options: availableTeachers,
						optionCount: availableTeachers.length
					};
				});
				
				// ΒΗΜΑ 6 & 7: Τοποθέτηση ανάλογα με την έκδοση αλγορίθμου
				const currentPlacements = {};     // Τοποθετήσεις αυτής της προσπάθειας
				const teacherDutyCount = {};      // Μετρητής εφημεριών ανά καθηγητή
				teachers.forEach(t => teacherDutyCount[t] = 0);
				
				if (algorithmSettings.algorithmVersion === "classic") {
					if (algorithmSettings.priorityCards) {
						if (algorithmSettings.randomOrder) {
							cardOptions.sort((a, b) => {
								if (a.optionCount !== b.optionCount) {
									return a.optionCount - b.optionCount;
								} else {
									return Math.random() - 0.5;
								}
							});
						} else {
							cardOptions.sort((a, b) => a.optionCount - b.optionCount);
						}
					} else {
						// Χωρίς προτεραιότητα - τυχαία σειρά
						cardOptions.sort(() => Math.random() - 0.5);
					}
					

					// ΠΡΟΣΟΧΗ: Εδώ γίνεται η ουσιαστική τοποθέτηση
					for (const {card, options} of cardOptions) {
						
						// ΕΛΕΓΧΟΣ 3: Ανάλογα με το επίπεδο χαλάρωσης από τους διαθέσιμους καθηγητές, ποιοι είναι εντός ορίων
						let eligibleTeachers = [];

						if (algorithmSettings.distribution === 'manual') {
							// ΧΕΙΡΟΚΙΝΗΤΗ: ΧΩΡΙΣ ΧΑΛΑΡΩΣΗ
							eligibleTeachers = options.filter(teacher => 
								teacherDutyCount[teacher] < teacherTargetsForAttempt[teacher]
							);
						} else {
							if (algorithmSettings.relaxation === 'none') {
								// Καθόλου χαλάρωση - μόνο αυστηρά εντός στόχων
								eligibleTeachers = options.filter(teacher => 
									teacherDutyCount[teacher] < teacherTargetsForAttempt[teacher]
								);
							} else {
								// Μερική χαλάρωση (+1 για βασικούς)
								// Για κάθε καθηγητή στις options
								eligibleTeachers = options.filter(teacher => {
									const target = teacherTargetsForAttempt[teacher];
									const currentCount = teacherDutyCount[teacher];
									
									if (target === baseDuties) {
										// Βασικοί καθηγητές (στόχος baseDuties): επιτρέπεται μέχρι baseDuties + 1
										return currentCount <= target + 1; // Μέχρι 3 αν baseDuties=2
									} else {
										// Extra καθηγητές (στόχος baseDuties+1): επιτρέπεται μέχρι τον στόχο
										return currentCount < target; // Μόνο μέχρι 3
									}
								});
							}
						}
						
						if (eligibleTeachers.length === 0) {
							console.log(`Κανένας διαθέσιμος καθηγητής για ${card.position} ημέρα ${card.day+1} βάρδια ${card.shift}`);
							continue; // Πήγαινε στην επόμενη κάρτα
						}
						
						// ΕΛΕΓΧΟΣ 4: Επιλογή καθηγητή βάσει προτεραιοτήτων
						eligibleTeachers.sort((a, b) => {
							if (algorithmSettings.priorityAvailability && algorithmSettings.priorityTeachers) {
								// Σύνθετη προτεραιότητα: πρώτα βάσει διαθεσιμότητας, μετά βάσει φόρτου
								if (teacherTotalAvailability[a] !== teacherTotalAvailability[b]) {
									return teacherTotalAvailability[a] - teacherTotalAvailability[b];
								} else {
									return teacherDutyCount[a] - teacherDutyCount[b];
								}
							} else if (algorithmSettings.priorityAvailability) {
								// Μόνο βάσει διαθεσιμότητας (καθηγητής  διαθέσιμος  λιγότερες μέρες)
								return teacherTotalAvailability[a] - teacherTotalAvailability[b];
							} else if (algorithmSettings.priorityTeachers) {
								// Μόνο βάσει φόρτου (καθηγητής  με τις λιγότερες εφημερίες μέχρι τώρα)
								return teacherDutyCount[a] - teacherDutyCount[b];
							} else {
								// Τυχαία επιλογή
								return Math.random() - 0.5;
							}
						});

						// ΔΟΚΙΜΑΣΕ κάθε επιλέξιμο καθηγητή μέχρι να βρεις έναν με ελεύθερο κελί
						let selectedTeacher = null;
						for (const teacher of eligibleTeachers) {
							// 5α. Αποκλεισμός αν ο καθηγητής έχει ήδη την ίδια θέση (οποιαδήποτε μέρα/βάρδια)
							if (teacherHasPositionInPlacements(teacher, card.position, currentPlacements)) {
								continue;
							}

							// ΕΛΕΓΧΟΣ 5: Ελέγξε αν το συγκεκριμένο κελί (καθηγητής, μέρα, βάρδια) είναι ελεύθερο
							const cellOccupied = Object.values(currentPlacements).some(p => 
								p.teacher === teacher && 
								p.day === days[card.day] && 
								p.shift === card.shift
							);
							
							if (!cellOccupied) {
								selectedTeacher = teacher;
								break;
							}
						}
						
						// Αν βρέθηκε κατάλληλος καθηγητής, τοποθέτησε
						if (selectedTeacher) {
							currentPlacements[card.id] = {
								teacher: selectedTeacher,
								day: days[card.day],
								shift: card.shift,
								position: card.position
							};
							
							teacherDutyCount[selectedTeacher]++;
						} else {
							console.log(`Όλοι οι διαθέσιμοι καθηγητές για ${card.position} έχουν ήδη κάρτα σε αυτό το κελί`);
						}
					}
				} else if (algorithmSettings.algorithmVersion === "MRV") {
					const remainingCards = [...cardOptions];	// Αντίγραφο του πίνακα με όλες τις κάρτες (cardOptions) για δυναμική επεξεργασία
					// Βρόχος: όσο υπάρχουν κάρτες που δεν έχουν ακόμα εξεταστεί
					while (remainingCards.length > 0) {
						// 1. Υπολόγισε εκ νέου τις διαθέσιμες επιλογές για κάθε εναπομείνουσα κάρτα
						for (let item of remainingCards) {
							// ΕΛΕΓΧΟΣ 3: Διαθέσιμοι καθηγητές βάσει ορίων (χαλάρωση)
							let availableNow = item.options.filter(teacher => {
								if (algorithmSettings.distribution === 'manual') {
									// Χειροκίνητη κατανομή: αυστηρά μικρότερο από τον στόχο
									return teacherDutyCount[teacher] < teacherTargetsForAttempt[teacher];
								} else {
									// Αυτόματη κατανομή: ελέγχουμε το επίπεδο χαλάρωσης
									if (algorithmSettings.relaxation === 'none') {
										return teacherDutyCount[teacher] < teacherTargetsForAttempt[teacher];
									} else {
										// Μερική χαλάρωση (+1 μόνο για βασικούς καθηγητές)
										const target = teacherTargetsForAttempt[teacher];
										const current = teacherDutyCount[teacher];
										if (target === baseDuties) {
											return current <= target + 1;	// βασικοί: επιτρέπεται +1
										} else {
											return current < target;	// extra: αυστηρά όριο
										}
									}
								}
							}).filter(teacher => {
								// ΕΛΕΓΧΟΣ 4: Αποκλείουμε καθηγητή που έχει ήδη την ίδια θέση σε οποιαδήποτε μέρα/βάρδια
								return !teacherHasPositionInPlacements(teacher, item.card.position, currentPlacements);
							}).filter(teacher => {
								// ΕΛΕΓΧΟΣ 5: Αποκλείουμε το κελί (μέρα, βάρδια) αν αυτό είναι κατειλημμένο
								const cellOccupied = Object.values(currentPlacements).some(p =>
									p.teacher === teacher &&
									p.day === days[item.card.day] &&
									p.shift === item.card.shift
								);
								return !cellOccupied;
							});
							
							 // Αποθηκεύουμε τους τρέχοντες διαθέσιμους καθηγητές και το πλήθος τους
							item.currentOptions = availableNow;
							item.optionCount = availableNow.length;
						}
						
						// 2. Ταξινόμησε τις υπόλοιπες κάρτες. Όσες κάρτες έχουν μικρότερο αριθμό επιλογών θα εξεταστούν πρώτες (MRV)
						remainingCards.sort((a, b) => a.optionCount - b.optionCount);
						
						// 3. Πάρε την κάρτα με τις λιγότερες επιλογές (MRV)
						const bestItem = remainingCards.shift();   // αφαίρεση της πρώτης κάρτας από τον πίνακα
						
						// Αν δεν υπάρχει κανένας διαθέσιμος καθηγητής, η κάρτα παραμένει εκτός
						if (bestItem.optionCount === 0) {
							console.log(`MRV: Κανένας διαθέσιμος καθηγητής για ${bestItem.card.position} ημέρα ${bestItem.card.day+1} βάρδια ${bestItem.card.shift}`);
							continue;   // προχωράμε στην επόμενη κάρτα
						}
						
						// ΕΛΕΓΧΟΣ 6: Επιλογή καθηγητή βάσει προτεραιοτήτων
						let eligibleTeachers = [...bestItem.currentOptions];	// Αντίγραφο των τρέχοντων διαθέσιμων καθηγητών για ταξινόμηση
						// Ταξινόμηση
						eligibleTeachers.sort((a, b) => {
							if (algorithmSettings.priorityAvailability && algorithmSettings.priorityTeachers) {
								// Σύνθετη προτεραιότητα: πρώτα βάσει διαθεσιμότητας, μετά βάσει φόρτου
								if (teacherTotalAvailability[a] !== teacherTotalAvailability[b]) {
									return teacherTotalAvailability[a] - teacherTotalAvailability[b];
								} else {
									return teacherDutyCount[a] - teacherDutyCount[b];
								}
							} else if (algorithmSettings.priorityAvailability) {
								// Μόνο βάσει διαθεσιμότητας (καθηγητής  διαθέσιμος  λιγότερες μέρες)
								return teacherTotalAvailability[a] - teacherTotalAvailability[b];
							} else if (algorithmSettings.priorityTeachers) {
								// Μόνο βάσει φόρτου (καθηγητής  με τις λιγότερες εφημερίες μέχρι τώρα)
								return teacherDutyCount[a] - teacherDutyCount[b];
							} else {
								// Τυχαία επιλογή
								return Math.random() - 0.5;
							}
						});
						
						// Ο πρώτος καθηγητής μετά την ταξινόμηση είναι ο προτιμώμενος
						const selectedTeacher = eligibleTeachers[0];
						
						// 4. Τοποθέτησε την κάρτα
						currentPlacements[bestItem.card.id] = {
							teacher: selectedTeacher,
							day: days[bestItem.card.day],
							shift: bestItem.card.shift,
							position: bestItem.card.position
						};
						teacherDutyCount[selectedTeacher]++;	// αύξηση μετρητή εφημεριών
					} // while (remainingCards.length > 0)
				} else { // backtracking
					// Υπολογισμός teacherTargetsForAttempt (ήδη υπάρχει από πάνω)
					// Κλήση backtrackingAssignment
					const backtrackResult = backtrackingAssignment(
						allCards, teacherTargetsForAttempt, baseDuties,
						algorithmSettings, teacherTotalAvailability,
						days, teacherShifts, teacherPositionExclusions, teachers, 15000
					);
					if (backtrackResult) {
						Object.assign(currentPlacements, backtrackResult);
						// Ενημέρωση teacherDutyCount με βάση τα placements
						teachers.forEach(t => teacherDutyCount[t] = 0);
						for (let id in currentPlacements) {
							const p = currentPlacements[id];
							teacherDutyCount[p.teacher]++;
						}
					} else {
						// δεν βρέθηκε λύση, currentPlacements παραμένει κενό
					}
				}
				
				lastPlacements = {...currentPlacements};
				
				// ΒΗΜΑ 8: Αξιολόγηση αυτής της προσπάθειας
				const placed = Object.keys(currentPlacements).length;
				console.log(`Προσπάθεια ${attempts}: Τοποθετήθηκαν ${placed} από ${allCards.length} κάρτες`);
				
				// Αν είναι καλύτερη από την προηγούμενη καλύτερη, την κρατάμε
				if (placed > bestPlaced) {
					bestPlaced = placed;
					bestPlacements = {...currentPlacements};
					
					// Αν τοποθετήθηκαν ΟΛΕΣ, σταματάμε
					if (bestPlaced === allCards.length) {
						console.log('Βρέθηκε τέλεια λύση!');
						break;
					}
				}
			}
			
			// ΒΗΜΑ 9: Επιλογή λύσης βάσει συμπεριφοράς
			if (algorithmSettings.behavior === 'best') {
				// Κράτα την καλύτερη λύση
				placements = bestPlacements;
			} else {
				// Πάρε μια τυχαία λύση (την τελευταία προσπάθεια)
				// Αν δεν υπάρχει lastPlacements (π.χ. πρώτη προσπάθεια), χρησιμοποίησε bestPlacements
				placements = Object.keys(lastPlacements).length > 0 ? lastPlacements : bestPlacements;
			}
			
			// ΒΗΜΑ 10: Ανανέωση οθόνης
			displayTable();
			renderCards();
			
			// ΒΗΜΑ 11: Ενημέρωση χρήστη
			const unplacedCount = allCards.length - bestPlaced;
			if (bestPlaced === allCards.length) {
				showModalMessage(`Επιτυχία! Τοποθετήθηκαν και οι ${bestPlaced} κάρτες μετά από ${attempts} προσπάθειες.`, 'success', 3000);
			} else {
				// Βρες ποιες κάρτες έμειναν εκτός για βοήθεια στον εντοπισμό του προβλήματος
				const unplacedCards = allCards.filter(card => !placements[card.id]);
				const unplacedByPosition = {};
				unplacedCards.forEach(card => {
					if (!unplacedByPosition[card.position]) unplacedByPosition[card.position] = 0;
					unplacedByPosition[card.position]++;
				});
				
				console.log('Κάρτες εκτός ανά θέση:', unplacedByPosition);
				console.log('Σύνολο καρτών εκτός:', unplacedCards.length);
				
				const finalPlaced = Object.keys(placements).length;
				if (finalPlaced === allCards.length) {
					showModalMessage(`Επιτυχία! Τοποθετήθηκαν και οι ${finalPlaced} κάρτες μετά από ${attempts} προσπάθειες.`, 'success', 3000);
				} else {
					// ...
					showModalMessage(`Τοποθετήθηκαν ${finalPlaced} από ${allCards.length} κάρτες...`, 'info', 2500);
				}
			}
		}

		// Αποθήκευση ρυθμίσεων
		function saveConfiguration() {
			const config = {
				removedTeachers: Array.from(removedTeachers),
				teacherPositionExclusions: {}
			};
			for (let teacher in teacherPositionExclusions) {
				config.teacherPositionExclusions[teacher] = Array.from(teacherPositionExclusions[teacher]);
			}
			const jsonStr = JSON.stringify(config, null, 2);
			const blob = new Blob([jsonStr], { type: 'application/json' });
			const link = document.createElement('a');
			link.href = URL.createObjectURL(blob);
			link.download = 'efimeries_config.json';
			link.click();
			URL.revokeObjectURL(link.href);
			showModalMessage('Οι ρυθμίσεις αποθηκεύτηκαν', 'success', 2000);
		}

		// Φόρτωση ρυθμίσεων
		function loadConfiguration() {
			const input = document.createElement('input');
			input.type = 'file';
			input.accept = '.json';
			input.onchange = function(e) {
				const file = e.target.files[0];
				if (!file) return;
				const reader = new FileReader();
				reader.onload = function(ev) {
					try {
						const config = JSON.parse(ev.target.result);
						
						// 1. Ελέγχουμε removedTeachers
						const invalidRemoved = (config.removedTeachers || []).filter(t => !originalTeachers.includes(t));
						if (invalidRemoved.length > 0) {
							throw new Error(`Οι καθηγητές "${invalidRemoved.join('", "')}" δεν υπάρχουν στο σύστημα.`);
						}
						
						// 2. Ελέγχουμε teacherPositionExclusions (κλειδιά)
						const invalidExclusionTeachers = [];
						if (config.teacherPositionExclusions) {
							for (let teacher in config.teacherPositionExclusions) {
								if (!originalTeachers.includes(teacher)) {
									invalidExclusionTeachers.push(teacher);
								}
							}
						}
						if (invalidExclusionTeachers.length > 0) {
							throw new Error(`Οι καθηγητές "${invalidExclusionTeachers.join('", "')}" εμφανίζονται στους αποκλεισμούς αλλά δεν υπάρχουν στο σύστημα.`);
						}
						
						// 3. Εφαρμογή δεδομένων (μόνο αν όλα είναι έγκυρα)
						removedTeachers = new Set(config.removedTeachers || []);
						teacherPositionExclusions = {};
						if (config.teacherPositionExclusions) {
							for (let teacher in config.teacherPositionExclusions) {
								teacherPositionExclusions[teacher] = new Set(config.teacherPositionExclusions[teacher]);
							}
						}
						
						// Ανακατασκευή λίστας ενεργών καθηγητών
						teachers = originalTeachers.filter(t => !removedTeachers.has(t));
						
						// Ανανέωση όλων
						calculateShifts();
						placements = {};
						displayTable();
						renderCards();
						
						showModalMessage('Οι ρυθμίσεις φορτώθηκαν επιτυχώς', 'success', 2000);
					} catch (err) {
						showModalMessage(`Αδυναμία φόρτωσης: ${err.message}`, 'error', 4000);
					}
				};
				reader.readAsText(file, 'UTF-8');
			};
			input.click();
		}

		// Διαχείριση modal μηνυμάτων
		let messageQueue = [];
		let isDisplayingMessage = false;

		function showModalMessage(message, type, duration = 1000) {
			// Προσθήκη στην ουρά με τον χρόνο
			messageQueue.push({ message, type, duration });
			if (!isDisplayingMessage) {
				processNextMessage();
			}
		}

		function processNextMessage() {
			if (messageQueue.length === 0) {
				isDisplayingMessage = false;
				return;
			}

			isDisplayingMessage = true;
			const { message, type, duration } = messageQueue.shift();

			const modal = document.getElementById('messageModal');
			const header = document.getElementById('modalHeader');
			const title = document.getElementById('modalTitle');
			const body = document.getElementById('modalBody');

			// Ενημέρωση περιεχομένου ανάλογα με τον τύπο
			if (type === 'error') {
				title.textContent = 'Μήνυμα σφάλματος';
				header.className = 'modal-message-header error';
			} else if (type === 'success') {
				title.textContent = 'Επιτυχής ολοκλήρωση';
				header.className = 'modal-message-header success';
			} else {
				title.textContent = 'Μήνυμα';
				header.className = 'modal-message-header info';
			}
			body.textContent = message;
			modal.style.display = 'flex';

			// Κλείσιμο μετά από τον καθορισμένο χρόνο
			setTimeout(() => {
				modal.style.display = 'none';
				processNextMessage();
			}, duration);
		}

    </script>

	<!-- Popup Ρυθμίσεων -->
	<div id="settingsPopup" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2000;">
		<div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 20px; border-radius: 10px; min-width: 1000px; max-width: 1200px; box-shadow: 0 20px 60px rgba(0,0,0,0.3);">
			<h3 style="margin-bottom: 15px; color: #1e293b;">⚙️ Ρυθμίσεις Αλγορίθμου</h3>
			
			<div class="settings-two-columns">
				
				<div style="margin-bottom: 8px;">
					<label style="display: block; margin-bottom: 3px; font-weight: 600;">1. Αριθμός προσπαθειών:</label>
					<input type="number" id="settingAttempts" min="10" max="500" value="100" style="width: 100%; padding: 7px; border: 2px solid #cbd5e1; border-radius: 6px;">
				</div>

				<div style="margin-bottom: 8px;">
					<label style="display: block; margin-bottom: 3px; font-weight: 600;">2. Μέθοδος κατανομής:</label>
					<select id="settingDistribution" style="width: 100%; padding: 5px; border: 2px solid #cbd5e1; border-radius: 6px;">
						<option value="auto" selected>Αυτόματη</option>
						<option value="manual" >Χειροκίνητη</option>
					</select>
				</div>
				
				<div style="margin-bottom: 8px;">
					<label style="display: block; margin-bottom: 3px; font-weight: 600;">3. Έίδος Αλγόριθμου</label>
					<select id="settingAlgorithmVersion" onchange="toggleAlgorithmSpecificSettings()" style="width: 100%; padding: 5px; border: 2px solid #cbd5e1; border-radius: 6px;">
						<option value="classic" selected>Kλασσικός αλγόριθμος</option>
						<option value="MRV">Αλγόριθμος MRV (κάρτα με τις λιγότερες επιλογές</option>
						<option value="backtracking">Αλγόριθμος Backtracking (εξαντλητική αναζήτηση)</option>
					</select>
				</div>
				
				<div style="margin-bottom: 8px;">
					<label style="display: block; margin-bottom: 3px; font-weight: 600;">4. Συμπεριφορά Αλγορίθμου:</label>
					<select id="settingBehavior" style="width: 100%; padding: 5px; border: 2px solid #cbd5e1; border-radius: 6px;">
						<option value="best" selected>Να κρατάει πάντα την καλύτερη λύση</option>
						<option value="random">Να δείχνει διαφορετική κάθε φορά</option>
					</select>
				</div>
				
				<div style="margin-bottom: 8px;">
					<label style="display: block; margin-bottom: 3px; font-weight: 600;">5. Τυχαιότητα στη σειρά εφημεριών:</label>
					<select id="settingRandomOrder" style="width: 100%; padding: 5px; border: 2px solid #cbd5e1; border-radius: 6px;">
						<option value="yes" selected>Ναι</option>
						<option value="no">Όχι</option>
					</select>
				</div>

				<div style="margin-bottom: 8px;">
					<label style="display: block; margin-bottom: 3px; font-weight: 600;">6. Να επιτρέπεται ίδια εφημερία για τους καθηγητές:</label>
					<select id="settingAllowSamePosition" style="width: 100%; padding: 5px; border: 2px solid #cbd5e1; border-radius: 6px;">
						<option value="no" selected>Όχι (απαγόρευση)</option>
						<option value="yes">Ναι (επιτρέπεται)</option>
					</select>
				</div>
				
				<div style="margin-bottom: 8px;">
					<label style="display: block; margin-bottom: 3px; font-weight: 600;">7. Προτεραιότητα σε κάρτες με λίγες επιλογές:</label>
					<select id="settingPriorityCards" style="width: 100%; padding: 5px; border: 2px solid #cbd5e1; border-radius: 6px;">
						<option value="yes" selected>Ναι</option>
						<option value="no">Όχι</option>
					</select>
				</div>
				
				<div style="margin-bottom: 8px;">
					<label style="display: block; margin-bottom: 3px; font-weight: 600;">8. Προτεραιότητα σε καθηγητές με λίγες εφημερίες:</label>
					<select id="settingPriorityTeachers" style="width: 100%; padding: 5px; border: 2px solid #cbd5e1; border-radius: 6px;">
						<option value="yes" selected>Ναι</option>
						<option value="no">Όχι</option>
					</select>
				</div>
				
				<div style="margin-bottom: 8px;">
					<label style="display: block; margin-bottom: 3px; font-weight: 600;">9. Προτεραιότητα σε καθηγητές με λίγες διαθέσιμες μέρες:</label>
					<select id="settingPriorityAvailability" style="width: 100%; padding: 5px; border: 2px solid #cbd5e1; border-radius: 6px;">
						<option value="yes" selected>Ναι</option>
						<option value="no">Όχι</option>
					</select>
				</div>
				
				<div style="margin-bottom: 8px;">
					<label style="display: block; margin-bottom: 3px; font-weight: 600;">10. Επίπεδο χαλάρωσης:</label>
					<select id="settingRelaxation" style="width: 100%; padding: 5px; border: 2px solid #cbd5e1; border-radius: 6px;">
						<option value="none" selected>Καθόλου</option>
						<option value="partial">Μερική (+1 μόνο για βασικούς)</option>
					</select>
				</div>
				
			</div>
			
			<div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 10px;">
				<button class="btn-small" onclick="saveSettings()" style="background: #2563eb;">Αποθήκευση</button>
				<button class="btn-small" onclick="closeSettingsPopup()" style="background: #64748b;">Ακύρωση</button>
			</div>
		</div>
	</div>

	<!-- Popup Χειροκίνητης Κατανομής -->
	<div id="manualPopup" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2500;">
		<div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 10px; border-radius: 10px; max-height: 90vh; overflow-y: auto;">
			<h3 style="margin-bottom: 15px;">✏️ Χειροκίνητη Κατανομή Εφημεριών</h3>
			<div id="manualTargetsList"></div>
			<div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 15px;">
				<button class="btn-small" onclick="saveManualTargets()">Αποθήκευση</button>
				<button class="btn-small" onclick="closeManualPopup()">Ακύρωση</button>
			</div>
		</div>
	</div>	

	<!-- Popup διαχείρισης αποκλεισμών θέσεων -->
	<div id="exclusionPopup" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 3000;">
		<div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 20px; border-radius: 10px; min-width: 300px; box-shadow: 0 20px 60px rgba(0,0,0,0.3);">
			<h3 id="exclusionPopupTitle" style="margin-bottom: 15px;">Αποκλεισμός θέσεων</h3>
			<div id="exclusionCheckboxes" style="margin-bottom: 20px; max-height: 300px; overflow-y: auto;"></div>
			<div style="display: flex; gap: 10px; justify-content: flex-end;">
				<button class="btn-small" onclick="saveExclusions()" style="background: #2563eb;">Αποθήκευση</button>
				<button class="btn-small" onclick="closeExclusionPopup()" style="background: #64748b;">Ακύρωση</button>
			</div>
		</div>
	</div>

</body>
</html>
